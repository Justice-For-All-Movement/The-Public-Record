name: Deployment monitor contract
on:
  pull_request:
    paths:
      - .github/deployment-monitor.json
      - .github/workflows/deployment-monitor-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # NOTE (2026-11-15): this reusable workflow currently fails at startup from this
  # repository under both the old and new owner paths; the Development-Deployment-Monitor
  # repository must grant workflow access (or be published) to Justice-For-All-Movement.
  contract:
    uses: Justice-For-All-Movement/Development-Deployment-Monitor/.github/workflows/validate-client.yml@main
